name: OpenAPI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura del repo: el job no escribe en él, no comenta ni publica nada.
permissions:
  contents: read

jobs:
  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Lo mínimo que valida `start/env.ts` para arrancar la app. No hay `.env`
      # en CI y ninguno de estos valores es un secreto: `APP_KEY` es de usar y tirar.
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ci-only-app-key-not-a-secret-0123456789
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run openapi:check
