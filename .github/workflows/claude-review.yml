name: Revisor de código

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Un revisor por PR: si llega un push nuevo, el review en curso ya no sirve.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Los PR desde forks no reciben secretos y su GITHUB_TOKEN es de solo
    # lectura: el job fallaría sin poder revisar ni comentar. Se omiten.
    # Ver docs/ci-revisor.md.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # leer el repo
      pull-requests: write # publicar los comentarios del review
      id-token: write # la acción canjea el token OIDC por el de la app de Claude
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          # Token de suscripción (`claude setup-token`). Si se usa clave de API
          # de la consola, se cambia esta entrada por `anthropic_api_key` y el
          # secreto por ANTHROPIC_API_KEY: no son intercambiables.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request. Busca fallos reales de corrección,
            seguridad y regresiones; no comentes estilo ni preferencias.
            Lee los archivos del cambio con Read, Grep y Glob, y el diff con
            `gh pr diff`. No redirijas la salida de ningún comando a ficheros:
            lee la salida directa.

            Publica los hallazgos como comentarios en el PR: en línea sobre el
            código afectado cuando sea un punto concreto, y un comentario
            general para el resto. Si no encuentras nada que importe, dilo en
            un solo comentario. Responde en castellano.
          claude_args: |
            --model sonnet --effort medium --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
